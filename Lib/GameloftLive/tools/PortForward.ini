[Chainable Web Proxies]

## list of URL's for web proxies (such as cgi or php proxies) that accept chaining, i.e., that will 
## retrieve a target URL when entered in the following format:
##
##    <Insert Web Proxy URL>http://www.TargetUrl.com:port/
##
##    where <Insert Web Proxy URL> = one of the URL_01 etc shown below, 
##    such as http://www.ChainableWebProxy.com/index.php?q=
##    or http://www.ChainableWebProxy.com/cgi/
##
## These proxies will be used to test whether a port has or has not been opened successfully
## In use, the target machine's IP address is appended to what is entered to the URL's, for example:
##
##    http://www.ChainableWebProxy.com/index.php?q=http://215.68.120.5:9431/
##    or http://www.ChainableWebProxy.com/cgi/http://215.68.120.5:9431/


URL_01 = http://www.proxyhero.com/index.php?q=
URL_02 = http://anonymouse.org/cgi-bin/anon-www.cgi/


